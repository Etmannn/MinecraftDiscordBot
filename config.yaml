           # This is the letters, numbers and/or symbols you type to declare a command.
# Default is mc!.
# Example: mc!start. The prefix is mc! and the command is start.
prefix: "mc!"

# Change this to the query port of the Minecraft server.
# This is different to the regular port of the server.
# Default is 25565
port: "25565"

# Change this to the name of the start.bat file.
# Example: startserver.bat.
startbat: "start.bat"

# Set this to true or false depending on whether you want the server to turn off automatically.
# Default is true.
autostop: "true"

# In seconds how long it takes autostop to turn off the server after detecting no players online.
# Default is 300.
time: 300

# Change this to the channel ID where you want the bot messages to be sent.
# To find the channel ID of the selected channel you first need to enable developer mode on discord which can be found,
# under the advanced tab in settings. Then you want to right-click on the channel and press 'Copy Channel ID'.
channel: 1234567890

# Command Permissions.
# Change to the name of the role that you want to be able to use the bots commands. It is defaulted as @everyone.
# Example: Admin.
ping: '@everyone'
start: '@everyone'
stop: '@everyone'
restart: '@everyone'
help: '@everyone'

# Set this to true or false depending on whether you are using playit.gg to run your server.
# Default is false.
playit: "false"

# Add your Discord Bot token.
# To get a token follow this tutorial: https://youtu.be/ic5GuP-uHcg.
token: ""