# This is the letters, numbers and/or symbols you type to declare a command.
# Default is mc!.
# Example: mc!start. The prefix is mc! and the command is start.
prefix: "mc!"

# Change this to the IP address of the Minecraft server.
ip: ""

# Change this to the directory of the start.bat file.
# Example: C:/User/Steve/server/start.bat.
serverdir: ""

# Change this to the channel ID where you want the bot messages to be sent.
# To find the channel ID of the selected channel you first need to enable developer mode on discord which can be found,
# under the advanced tab in settings. Then you want to right-click on the channel and press 'Copy Channel ID'.
channel: 1234567890

# Command Permissions.
# Change to the name of the role that you want to be able to use the bots commands. It is defaulted as Everyone.
# Example: Admin.
ping: '@everyone'
start: '@everyone'
stop: '@everyone'
restart: '@everyone'
help: '@everyone'

# Set this to true of false depending on whether you are using playit.gg to run your server
playit: "false"

# Add your Discord Bot token.
# To get a token follow the first part of this tutorial:https://discord.com/developers/docs/quick-start/getting-started.
token: ""
